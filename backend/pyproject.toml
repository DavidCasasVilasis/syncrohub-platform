[project]
name = "syncrohub-backend"
version = "0.1.0"
description = "SyncroHub Smart Building & Energy Management Platform Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "python-dateutil>=2.9.0.post0",
    "sqlmodel>=0.0.47",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
